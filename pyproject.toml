[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-credit-advisor"
version = "0.1.0"
description = "A deterministic job-creation tax-credit engine with JSON rule packs, an audit trail, and advisory narration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emory Long" }]
keywords = ["tax-credit", "statutory", "audit-trail", "deterministic", "advisory", "llm", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
tax-credit = "tax_credit_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_credit_advisor = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
